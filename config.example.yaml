# GoGCBot Configuration File
telegram_token: "YOUR_TELEGRAM_BOT_TOKEN"
super_admin_id: 123456789 # Replace with your Telegram User ID
moderation_group_id: -1001234567890 # Replace with your Private Moderation Group Chat ID
db_path: "gogcbot.db"
log_level: "info"
cleanup_interval_hours: 1

auto_flag:
  enabled: true
  low_rep_threshold: 50
  flag_on_links: true
  new_user_min_posts: 3
  blocked_keywords:
    - "crypto giveaway"
    - "t.me/"
    - "whatsapp.com"
    - "fast money"
    - "airdrop"
    - "free rolls"

reputation:
  default_initial: 0
  flag_threshold: 40
  approve_bonus: 5
  delete_penalty: 10
  warn_penalty: 20
  mute_penalty: 30
  ban_penalty: 50

detector:
  enabled: true
  new_user_cjk:
    enabled: true
    min_high_user_id: 1000000000
    max_reputation: 5
    max_user_posts: 5
    rep_penalty: 20
  new_user_spam_bio:
    enabled: true
    max_reputation: 5
    max_user_posts: 5
    rep_penalty: 20
  red_packet_name:
    enabled: true
    min_high_user_id: 1000000000
    max_reputation: 5
    max_user_posts: 5
    min_username_length: 5
    min_cjk_ratio: 0.5
    min_cjk_chars: 1
    rep_penalty: 20

shieldy:
  enabled: true
  rep_bonus: 5
  max_messages: 5
  recheck_delay_minutes: 6

